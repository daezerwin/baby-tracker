; PHP's compiled-in defaults (upload_max_filesize=2M, post_max_size=8M) are
; too small for a modern phone photo, let alone a video. Each upload is its
; own request (see resources/views/baby-photos/index.blade.php), so these
; only need to comfortably fit one file at a time, not a whole batch — sized
; generously here for a short baby-moment video clip, not a feature film.
upload_max_filesize = 500M
post_max_size = 520M

; A large upload over a slow mobile connection can take a while to arrive,
; and EXIF/video handling on a big file takes longer than PHP's 30s default.
max_execution_time = 600
max_input_time = 600
memory_limit = 512M
