; PHP's compiled-in defaults (upload_max_filesize=2M, post_max_size=8M) are
; too small for a modern phone photo. Each photo is uploaded as its own
; request (see resources/views/baby-photos/index.blade.php), so these only
; need to comfortably fit one photo at a time, not a whole batch — sized
; generously here so even large uncompressed/RAW-adjacent phone photos go
; through without a resize step first.
upload_max_filesize = 200M
post_max_size = 210M

; A large upload over a slow mobile connection can take a while to arrive,
; and EXIF/image handling on a big file takes longer than PHP's 30s default.
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
