ServerName localhost

# Apache's compiled-in default (60s) can cut off a large photo or video
# upload on a slow connection before PHP even gets a chance to time it out.
TimeOut 600

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
