services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/daezerwin/baby-tracker:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_NAME: "Baby Tracker"
      APP_ENV: production
      APP_KEY: ${APP_KEY:?APP_KEY is required — see README-DOCKER.md}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Manila}

      LOG_CHANNEL: stack
      LOG_LEVEL: error

      DB_CONNECTION: sqlite
      DB_DATABASE: /var/lib/baby-tracker/database.sqlite

      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local

      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-null}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: "Baby Tracker"
    volumes:
      - baby_tracker_database:/var/lib/baby-tracker
      - baby_tracker_storage:/var/www/html/storage

volumes:
  baby_tracker_database:
  baby_tracker_storage:
